<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c36"><title>Getränkelager</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173c36;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}header{background:#173c36;color:white;padding:22px 18px 18px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.8}.wrap{max-width:650px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.stat{background:white;border-radius:15px;padding:15px;box-shadow:0 2px 12px #142e2710}.stat strong{display:block;font-size:29px}.stat small{color:#66756e}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,button{font:inherit}input,select{padding:12px;border:1px solid #cbd7d0;border-radius:11px;background:white;min-width:0;width:100%}#search{flex:1;min-width:130px}#filter{width:145px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:650;cursor:pointer;background:#e4ede8;color:#173c36}button.primary{background:#176b53;color:white}button.danger{color:#a12e2e;background:#fce9e9}button:active{transform:scale(.98)}.item{background:white;border-radius:16px;margin:10px 0;padding:15px;box-shadow:0 2px 12px #142e2710}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.name{font-size:18px;font-weight:750;overflow-wrap:anywhere}.meta{font-size:13px;color:#66756e;margin-top:4px}.pill{background:#fff0db;color:#985300;border-radius:20px;padding:5px 9px;font-size:12px;white-space:nowrap}.controls{display:flex;align-items:center;gap:9px;margin-top:14px}.controls button{font-size:21px;width:44px;height:43px;padding:0}.count{font-size:23px;font-weight:750;min-width:35px;text-align:center}.spacer{flex:1}.edit{font-size:13px}.empty{text-align:center;color:#6b7971;padding:36px 12px}dialog{border:0;border-radius:19px;padding:0;width:min(92vw,460px);max-height:90vh;overflow:auto}dialog::backdrop{background:#0b1b17a8}.modal{padding:20px}.modal h2{margin:0 0 18px}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.hint{font-size:12px;color:#63766b;margin:12px 0}.bottom{position:sticky;bottom:0;background:#f3f6f4eF;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #dfe9e3}.bottom button{width:100%;max-width:650px;display:block;margin:auto;font-size:17px;padding:15px}.row{display:flex;gap:8px}.row>.field{flex:1;min-width:0}footer{font-size:12px;text-align:center;color:#69776e;padding:10px 15px 25px}
</style></head><body><header><div style="max-width:650px;margin:auto"><h1>🥤 Getränkelager</h1><p>Säfte & Spirituosen im Überblick</p></div></header><main class="wrap"><div class="stats"><div class="stat"><strong id="total">0</strong><small>Artikel</small></div><div class="stat"><strong id="low">0</strong><small>Nachbestellen</small></div></div><div class="tools"><input id="search" type="search" placeholder="🔎 Artikel suchen …" aria-label="Artikel suchen"><select id="filter" aria-label="Kategorie filtern"><option value="">Alle Kategorien</option><option>Saft</option><option>Spirituose</option><option>Sonstiges</option></select></div><section id="items" aria-live="polite"></section><p class="hint">Deine Daten werden auf diesem Gerät im Browser gespeichert. Für eine Sicherung kannst du sie exportieren.</p><div class="tools"><button id="export">⬇ Daten sichern</button><button id="import">⬆ Sicherung laden</button><input type="file" id="file" accept="application/json,.json" hidden></div></main><footer>Getränkelager · Offline nutzbar nach dem ersten Laden</footer><div class="bottom"><button class="primary" id="add">＋ Neuen Artikel hinzufügen</button></div><dialog id="dialog"><form id="form" class="modal"><h2 id="dialogTitle">Artikel hinzufügen</h2><div class="field"><label for="name">Artikelname *</label><input id="name" maxlength="100" required placeholder="z. B. Orangensaft"></div><div class="field"><label for="category">Kategorie</label><select id="category"><option>Saft</option><option>Spirituose</option><option>Sonstiges</option></select></div><div class="row"><div class="field"><label for="size">Gebinde / Größe</label><input id="size" maxlength="40" placeholder="z. B. 1 Liter"></div><div class="field"><label for="unit">Einheit</label><select id="unit"><option>Flaschen</option><option>Kartons</option><option>Stück</option><option>Liter</option></select></div></div><div class="row"><div class="field"><label for="stock">Bestand</label><input id="stock" type="number" min="0" max="999999" step="1" value="0" required></div><div class="field"><label for="min">Mindestbestand</label><input id="min" type="number" min="0" max="999999" step="1" value="3" required></div></div><div class="actions"><button type="button" id="cancel">Abbrechen</button><button class="primary" type="submit">Speichern</button></div><div class="actions" id="deleteWrap" hidden><button class="danger" type="button" id="delete">Artikel löschen</button></div></form></dialog><script>
(()=>{'use strict';const KEY='getraenkelager_v1';let articles=[];let editing=null;const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(articles));render()};try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))articles=v.filter(valid)}catch(e){alert('Gespeicherte Daten konnten nicht gelesen werden. Bitte vor Änderungen eine Sicherung prüfen.')}function valid(a){return a&&typeof a.id==='string'&&typeof a.name==='string'&&a.name.trim()&&['Saft','Spirituose','Sonstiges'].includes(a.category)&&Number.isSafeInteger(a.stock)&&a.stock>=0&&Number.isSafeInteger(a.min)&&a.min>=0&&typeof a.size==='string'&&['Flaschen','Kartons','Stück','Liter'].includes(a.unit)}function render(){const q=$('search').value.toLocaleLowerCase('de').trim(),f=$('filter').value;const shown=articles.filter(a=>(!f||a.category===f)&&a.name.toLocaleLowerCase('de').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'de'));$('total').textContent=articles.length;$('low').textContent=articles.filter(a=>a.stock<=a.min).length;const root=$('items');root.replaceChildren();if(!shown.length){const p=document.createElement('p');p.className='empty';p.textContent=articles.length?'Keine passenden Artikel gefunden.':'Noch keine Artikel vorhanden. Füge deinen ersten Artikel hinzu!';root.append(p)}for(const a of shown){const el=document.createElement('article');el.className='item';const top=document.createElement('div');top.className='top';const info=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=a.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=[a.category,a.size,a.unit].filter(Boolean).join(' · ');info.append(name,meta);top.append(info);if(a.stock<=a.min){const pill=document.createElement('span');pill.className='pill';pill.textContent='Nachbestellen';top.append(pill)}const controls=document.createElement('div');controls.className='controls';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label',a.name+' Bestand reduzieren');minus.disabled=a.stock===0;minus.onclick=()=>{if(a.stock>0){a.stock--;save()}};const count=document.createElement('span');count.className='count';count.textContent=a.stock;const plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label',a.name+' Bestand erhöhen');plus.onclick=()=>{if(a.stock<999999){a.stock++;save()}};const spacer=document.createElement('span');spacer.className='spacer';const edit=document.createElement('button');edit.className='edit';edit.textContent='Bearbeiten';edit.onclick=()=>open(a);controls.append(minus,count,plus,spacer,edit);el.append(top,controls);root.append(el)}}function open(a){editing=a?.id??null;$('dialogTitle').textContent=a?'Artikel bearbeiten':'Artikel hinzufügen';$('name').value=a?.name??'';$('category').value=a?.category??'Saft';$('size').value=a?.size??'';$('unit').value=a?.unit??'Flaschen';$('stock').value=a?.stock??0;$('min').value=a?.min??3;$('deleteWrap').hidden=!a;$('dialog').showModal()}$('add').onclick=()=>open(null);$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim(),stock=Number($('stock').value),min=Number($('min').value);if(!name||![stock,min].every(n=>Number.isSafeInteger(n)&&n>=0&&n<=999999)){alert('Bitte gültige Werte eingeben.');return}const a={id:editing??(crypto.randomUUID?.()??String(Date.now())+Math.random()),name,category:$('category').value,size:$('size').value.trim(),unit:$('unit').value,stock,min};if(editing){const i=articles.findIndex(x=>x.id===editing);if(i<0)return;articles[i]=a}else articles.push(a);try{save();$('dialog').close()}catch(e){alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen.')}};$('delete').onclick=()=>{if(!editing||!confirm('Artikel wirklich löschen?'))return;articles=articles.filter(a=>a.id!==editing);try{save();$('dialog').close()}catch(e){alert('Löschen konnte nicht gespeichert werden.')}};$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,articles},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='getraenkelager-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('Datei zu groß');const data=JSON.parse(await file.text());if(!data||data.version!==1||!Array.isArray(data.articles)||!data.articles.every(valid))throw Error('Ungültiges Sicherungsformat');if(confirm('Aktuelle Artikel durch die Sicherung ersetzen?')){articles=data.articles;save()}}catch(err){alert('Sicherung konnte nicht geladen werden: '+err.message)}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
